name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lua-tests:
    name: Lua unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 lua-bitop luarocks openssl
          # lua-cjson requires lua5.1 dev headers; lua-openssl needs libssl-dev
          sudo apt-get install -y liblua5.1-dev libssl-dev
          sudo luarocks --lua-version 5.1 install lua-cjson
          # lua-openssl (rock name "openssl"): the GCM backend. Without it the
          # AES-GCM tests skip -- OPENUF_REQUIRE_GCM below turns that skip into
          # a hard failure so CI can never silently lose GCM coverage.
          sudo luarocks --lua-version 5.1 install openssl LUA_INCDIR=/usr/include/lua5.1

      - name: Run tests
        run: OPENUF_REQUIRE_GCM=1 lua5.1 tests/run_tests.lua

  simulate:
    name: End-to-end adoption simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 liblua5.1-dev lua-bitop luarocks openssl python3-pip
          sudo ln -sf /usr/bin/lua5.1 /usr/local/bin/lua
          # LUA_INCDIR must be given explicitly or luarocks fails with
          # "Failed finding Lua header files" on a clean runner.
          sudo luarocks --lua-version 5.1 install lua-cjson LUA_INCDIR=/usr/include/lua5.1
          sudo luarocks --lua-version 5.1 install luasocket LUA_INCDIR=/usr/include/lua5.1
          # pip (not apt python3-pycryptodome, which ships the Cryptodome namespace)
          # so the controller's `import Crypto` resolves.
          pip3 install --break-system-packages pycryptodome

      # Drives crypto (openssl-CLI CBC), TCP/HTTP POST, the http_post partial-read
      # path, and TNBU parse — i.e. the integration a device performs at adoption.
      # This exercises what unit tests can't and guards against runtime-only
      # regressions like the ones this OpenWrt 25.12 pass fixed.
      - name: Run adoption simulation
        run: |
          sh tools/simulate.sh --adopt
          sh tools/simulate.sh

      # dist.sh --verify proves the comment-stripped tree is bytecode-identical
      # to the source and still passes the suite. It used to run only when a
      # release tag was pushed, so a strip regression could sit on main
      # unnoticed until the next release was cut.
      - name: Package and verify the stripped tree
        run: sh tools/dist.sh --verify

  python-controller-syntax:
    name: Python controller syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax
        run: python3 -m py_compile tools/test_controller.py && echo "OK"

  shell-syntax:
    name: Shell script syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the shell scripts
        run: |
          bash -n install.sh
          bash -n setup.sh
          bash -n update.sh
          bash -n tools/check.sh
          bash -n tools/deploy.sh
          bash -n tools/dist.sh
          bash -n tools/simulate.sh
          bash -n openuf/hook/syswrapper.sh
          bash -n openuf/hook/adopt-shell.sh
          bash -n openuf/etc/init.d/openuf || true  # uses /etc/rc.common sourcing, not plain bash
          # The device runs busybox ash, not bash. dash is the strictest POSIX
          # shell available on a runner and catches bashisms bash -n accepts --
          # setup.sh is the one that has to survive being piped into `sh` on an
          # OpenWrt box, so it is checked twice.
          dash -n setup.sh
          dash -n install.sh
          dash -n update.sh
          dash -n tools/deploy.sh
          bash -n openuf/hook/openuf-deps.sh && dash -n openuf/hook/openuf-deps.sh
          # The LuCI packages' uci-defaults run under busybox ash on the device.
          for f in package/luci-app-openuf/root/etc/uci-defaults/* package/luci-theme-halo/root/etc/uci-defaults/*; do
            bash -n "$f" && dash -n "$f"
          done

  web-syntax:
    name: Device page, LuCI views and theme script syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Plain browser JavaScript with no build step: a syntax error ships as a
      # blank page on every router, so parse each file before it can.
      - name: Parse every shipped script
        run: |
          for f in package/luci-app-openuf/htdocs/openuf/portal.js \
              package/luci-app-openuf/htdocs/luci-static/resources/preload/*.js \
              package/luci-app-openuf/htdocs/luci-static/resources/view/openuf/*.js \
              package/luci-app-openuf/htdocs/luci-static/resources/view/status/include/*.js \
              package/luci-theme-halo/htdocs/luci-static/resources/*.js; do
            node --check "$f" && echo "ok $f"
          done
          for f in package/luci-app-openuf/root/usr/share/rpcd/acl.d/*.json; do
            python3 -m json.tool "$f" > /dev/null && echo "ok $f"
          done
